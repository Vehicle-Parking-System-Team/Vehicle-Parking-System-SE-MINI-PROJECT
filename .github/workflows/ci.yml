name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral test signing key
        run: |
          echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"

      - name: Run Django system check
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test --verbosity 2

  postgres-integrity:
    name: PostgreSQL slot integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: parking_test
          POSTGRES_PASSWORD: parking_test
          POSTGRES_DB: parking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: parking_test
      DB_USER: parking_test
      DB_PASSWORD: parking_test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r requirements-postgres.txt
      - name: Verify slot state, integrity and concurrent allocation
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')"
          python manage.py test parking_slots.test_integrity parking_slots.test_services operations.test_checkout operations.tests reservations.test_concurrency --verbosity 2

  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend helper tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Run React production build
        run: npm run build
